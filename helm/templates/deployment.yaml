apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mysql.serviceUrl }}
spec:
  selector:
    app: {{ .Chart.Name }}-{{ .Release.Name }}
  ports:
  - port: {{ .Values.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-{{ .Release.Name }}
  labels:
    app: {{ .Chart.Name }}-{{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-{{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-{{ .Release.Name }}
    spec:
      containers:
      - name: mysql-server
        image: {{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.version }}
        env:
        - name: MYSQL_DATABASE
          value: {{ .Values.mysql.database }}
        envFrom:
        - secretRef:
            name: mysql-secret # Injecting MYSQL_USER, MYSQL_PASSWORD, and MYSQL_ROOT_PASSWORD all at once
        # - name: MYSQL_USER
        #   valueFrom:
        #     secretKeyRef:
        #       name: mysql-secret
        #       key: MYSQL_USER
        # - name: MYSQL_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: mysql-secret
        #       key: MYSQL_PASSWORD
        # - name: MYSQL_ROOT_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: mysql-secret
        #       key: MYSQL_ROOT_PASSWORD
        ports:
        - containerPort: {{ .Values.service.port }}
          name: mysql
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: mysql8-persistent-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql8-persistent-storage
        persistentVolumeClaim:
          claimName: pvc-{{ .Chart.Name }}
