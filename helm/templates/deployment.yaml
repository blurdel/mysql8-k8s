apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-{{ .Release.Name }}
  labels:
    app: {{ .Chart.Name }}-{{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-{{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-{{ .Release.Name }}
    spec:
      containers:
      - name: mysql-server
        image: {{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.version }}
        imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
        env:
        - name: MYSQL_DATABASE
          value: {{ .Values.mysql.database }}
        envFrom:
        - secretRef:
            name: mysql-secret # Injecting all 3 secrets
        ports:
        - containerPort: {{ .Values.service.port }}
          name: mysql
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: mysql8-persistent-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql8-persistent-storage
        persistentVolumeClaim:
          claimName: pvc-{{ .Chart.Name }}
