# Default values for MySql8

replicas: 1

mysql:
  image:
    repository: mysql
    version: 8.4.0
    pullPolicy: IfNotPresent
  serviceUrl: mysql-service
  database: SPRING
  user: "tmuser"

service:
  type: ClusterIP
  port: 3306

resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 0.5
    memory: 1Gi

livenessProbe:
  tcpSocket:
    port: mysql
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
readinessProbe:
  tcpSocket:
    port: mysql
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 5
startupProbe:
  tcpSocket:
    port: mysql
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 10